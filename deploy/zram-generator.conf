# DESIGN.md §2.1: mandatory zram swap. Current Raspberry Pi OS Lite images ship this
# enabled by default (/dev/zram0, zstd, sized to full RAM via the OS's own generator
# config) — confirmed on the actual board — so deploy/README.md verifies rather than
# installs. This file is a fallback only, for an image or release where it turns out not
# to be preconfigured:
#
#   sudo apt install systemd-zram-generator
#   sudo cp deploy/zram-generator.conf /etc/systemd/zram-generator.conf
#   sudo systemctl daemon-reload && sudo systemctl start systemd-zram-setup@zram0.service
#   (or reboot — it activates automatically at boot from here on)
# Verify with: zramctl / swapon --show

[zram0]
zram-size = min(ram / 2, 512)
compression-algorithm = zstd
swap-priority = 100
